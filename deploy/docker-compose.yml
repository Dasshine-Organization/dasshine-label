# Dasshine Label — 生产/一体化部署
# 用法: ./deploy.sh up -d

name: dasshine-label

services:
  db:
    image: postgres:15-alpine
    container_name: dasshine-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dasshine}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dasshine123}
      POSTGRES_DB: ${POSTGRES_DB:-dasshine_label}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dasshine} -d ${POSTGRES_DB:-dasshine_label}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: dasshine-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: dasshine-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dasshine}:${POSTGRES_PASSWORD:-dasshine123}@db:5432/${POSTGRES_DB:-dasshine_label}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      UPLOAD_DIR: /app/uploads
      FILE_SERVER_BASE_URL: ${PUBLIC_URL:-http://localhost:8080}
      BACKEND_CORS_ORIGINS: ${PUBLIC_URL:-http://localhost:8080}
      PRELABEL_ENABLE_LOCAL: ${PRELABEL_ENABLE_LOCAL:-false}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_PREFIX: ${S3_PREFIX:-dasshine}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_VERIFY_SSL: ${S3_VERIFY_SSL:-true}
    volumes:
      - upload_data:/app/uploads
      - model_data:/app/models
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
        VITE_FILE_SERVER_URL: ${PUBLIC_URL:-http://localhost:8080}
    container_name: dasshine-frontend
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      - backend

  # 默认随栈启动：异步导出 / 导入 / 超时回收 / 黄金题轮换
  celery:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: dasshine-celery
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dasshine}:${POSTGRES_PASSWORD:-dasshine123}@db:5432/${POSTGRES_DB:-dasshine_label}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      DEBUG: ${DEBUG:-false}
      UPLOAD_DIR: /app/uploads
      FILE_SERVER_BASE_URL: ${PUBLIC_URL:-http://localhost:8080}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_PREFIX: ${S3_PREFIX:-dasshine}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_VERIFY_SSL: ${S3_VERIFY_SSL:-true}
    volumes:
      - upload_data:/app/uploads
    command: ["celery", "-A", "app.celery_app", "worker", "--loglevel=info"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  celery-beat:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: dasshine-celery-beat
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dasshine}:${POSTGRES_PASSWORD:-dasshine123}@db:5432/${POSTGRES_DB:-dasshine_label}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      DEBUG: ${DEBUG:-false}
      UPLOAD_DIR: /app/uploads
      FILE_SERVER_BASE_URL: ${PUBLIC_URL:-http://localhost:8080}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_PREFIX: ${S3_PREFIX:-dasshine}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_VERIFY_SSL: ${S3_VERIFY_SSL:-true}
    volumes:
      - upload_data:/app/uploads
    command: ["celery", "-A", "app.celery_app", "beat", "--loglevel=info"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started

volumes:
  postgres_data:
  upload_data:
  redis_data:
  model_data:
