# 本地开发栈（数据库 + 后端热重载 + Vite 前端）
# 用法: ./deploy.sh dev

name: dasshine-label-dev

services:
  db:
    image: postgres:15-alpine
    container_name: dasshine-db-dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dasshine}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dasshine123}
      POSTGRES_DB: ${POSTGRES_DB:-dasshine_label}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dasshine} -d ${POSTGRES_DB:-dasshine_label}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: dasshine-redis-dev
    ports:
      - "${REDIS_PORT:-6379}:6379"

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: dasshine-backend-dev
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dasshine}:${POSTGRES_PASSWORD:-dasshine123}@db:5432/${POSTGRES_DB:-dasshine_label}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key}
      DEBUG: "true"
      UPLOAD_DIR: /app/uploads
      FILE_SERVER_BASE_URL: http://localhost:8000
      BACKEND_CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      PRELABEL_ENABLE_LOCAL: ${PRELABEL_ENABLE_LOCAL:-false}
    ports:
      - "8000:8000"
    volumes:
      - ../backend/app:/app/app
      - upload_data_dev:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  frontend:
    image: node:20-alpine
    container_name: dasshine-frontend-dev
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
      VITE_FILE_SERVER_URL: http://localhost:8000
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 3000"
    depends_on:
      - backend

  celery:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: dasshine-celery-dev
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dasshine}:${POSTGRES_PASSWORD:-dasshine123}@db:5432/${POSTGRES_DB:-dasshine_label}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key}
      DEBUG: "true"
      UPLOAD_DIR: /app/uploads
      FILE_SERVER_BASE_URL: http://localhost:8000
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_PREFIX: ${S3_PREFIX:-dasshine}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_VERIFY_SSL: ${S3_VERIFY_SSL:-true}
    volumes:
      - ../backend/app:/app/app
      - upload_data_dev:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: ["celery", "-A", "app.celery_app", "worker", "--loglevel=info"]

  celery-beat:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: dasshine-celery-beat-dev
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dasshine}:${POSTGRES_PASSWORD:-dasshine123}@db:5432/${POSTGRES_DB:-dasshine_label}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key}
      DEBUG: "true"
      UPLOAD_DIR: /app/uploads
      FILE_SERVER_BASE_URL: http://localhost:8000
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_PREFIX: ${S3_PREFIX:-dasshine}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_VERIFY_SSL: ${S3_VERIFY_SSL:-true}
    volumes:
      - ../backend/app:/app/app
      - upload_data_dev:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: ["celery", "-A", "app.celery_app", "beat", "--loglevel=info"]

volumes:
  postgres_data_dev:
  upload_data_dev:
  frontend_node_modules:
